<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="S / D"
    >

    <title>S / D</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f7;
            color: #1c1c1e;
        }


        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }


        h1 {
            text-align: center;
            margin-bottom: 25px;
        }


        /* --------------------------------------------------
           RÉSUMÉ
        -------------------------------------------------- */

        .summary {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }


        .summary-card {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;

            box-shadow:
                0 1px 4px rgba(0,0,0,0.08);
        }


        .summary-code {
            font-size: 24px;
            font-weight: bold;
        }


        .summary-value {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }


        /* --------------------------------------------------
           TABLEAU
        -------------------------------------------------- */

        .table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;

            box-shadow:
                0 1px 4px rgba(0,0,0,0.08);
        }


        table {
            width: 100%;
            border-collapse: collapse;
        }


        th {
            background: #eeeeef;
            padding: 12px 8px;
            font-size: 14px;
        }


        td {
            padding: 14px 6px;
            text-align: center;
            border-top: 1px solid #eeeeee;
            font-size: 16px;
        }


        td:first-child {
            text-align: left;
            padding-left: 14px;
        }


        .delete-button {
            border: none;
            background: transparent;
            color: #999;

            font-size: 22px;

            width: 35px;
            height: 35px;

            cursor: pointer;
        }


        .delete-button:active {
            color: #ff3b30;
        }


        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }


        /* --------------------------------------------------
           BOUTON +
        -------------------------------------------------- */

        .add-button {
            display: block;

            width: 56px;
            height: 56px;

            margin: 25px auto 0;

            border: none;
            border-radius: 50%;

            background: #007aff;
            color: white;

            font-size: 32px;
            line-height: 56px;

            cursor: pointer;

            box-shadow:
                0 3px 8px rgba(0,0,0,0.2);
        }


        .add-button:active {
            transform: scale(0.95);
        }


        /* --------------------------------------------------
           BOUTON RETOUR EN HAUT
        -------------------------------------------------- */

        .top-button {
            display: block;

            width: 46px;
            height: 46px;

            margin: 15px auto 0;

            border: none;
            border-radius: 50%;

            background: #d1d1d6;
            color: #1c1c1e;

            font-size: 24px;
            line-height: 46px;

            cursor: pointer;

            box-shadow:
                0 2px 6px rgba(0,0,0,0.15);
        }


        .top-button:active {
            transform: scale(0.95);
        }


        /* --------------------------------------------------
           BOUTONS EXCEL
        -------------------------------------------------- */

        .export-button,
        .import-button {
            display: block;

            width: 100%;

            margin-top: 15px;

            padding: 12px;

            border: none;
            border-radius: 10px;

            font-size: 16px;
            font-family: inherit;

            cursor: pointer;
        }


        .export-button {
            background: #e5e5ea;
            color: #1c1c1e;
        }


        .import-button {
            background: #e5e5ea;
            color: #1c1c1e;
        }


        .export-button:active,
        .import-button:active {
            opacity: 0.6;
        }


        /* --------------------------------------------------
           MODALE
        -------------------------------------------------- */

        #modal {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,0.4);

            align-items: center;
            justify-content: center;

            z-index: 1000;
        }


        .modal-content {
            background: white;

            width: calc(100% - 40px);
            max-width: 400px;

            border-radius: 16px;

            padding: 25px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.2);
        }


        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }


        .modal-content label {
            display: block;

            font-size: 15px;
            font-weight: 500;

            margin-bottom: 6px;
        }


        /* --------------------------------------------------
           DATE
        -------------------------------------------------- */

        #dateInput {
            display: block;

            width: 100%;
            height: 48px;

            padding: 8px 12px;

            margin: 8px 0 20px;

            font-size: 17px;
            font-family: inherit;

            border: 1px solid #ccc;
            border-radius: 8px;

            background: white;
            color: #1c1c1e;

            appearance: auto;
            -webkit-appearance: auto;
        }


        /* --------------------------------------------------
           CHOIX S / D
        -------------------------------------------------- */

        .code-buttons {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }


        .code-button {
            flex: 1;

            padding: 12px;

            font-size: 18px;
            font-family: inherit;

            border: 1px solid #ccc;
            border-radius: 8px;

            background: white;

            cursor: pointer;
        }


        .code-button:active {
            opacity: 0.7;
        }


        /* --------------------------------------------------
           BOUTONS MODALE
        -------------------------------------------------- */

        .modal-actions {
            display: flex;

            gap: 10px;

            margin-top: 25px;
        }


        .modal-actions button {
            flex: 1;

            padding: 12px;

            font-size: 16px;
            font-family: inherit;

            border: 1px solid #ccc;
            border-radius: 8px;

            background: white;

            cursor: pointer;
        }


        #addButton {
            background: #007aff;
            color: white;
            border-color: #007aff;
        }


        .modal-actions button:active {
            opacity: 0.7;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>S / D</h1>


    <!-- --------------------------------------------------
         RÉSUMÉ
    -------------------------------------------------- -->

    <div class="summary">


        <div class="summary-card">

            <div class="summary-code">
                S
            </div>

            <div class="summary-value">

                <strong id="daysS">—</strong>
                <br>

                Total :
                <strong id="totalS">0</strong>

                <br>

                Moyenne :
                <strong id="averageS">—</strong>

            </div>

        </div>


        <div class="summary-card">

            <div class="summary-code">
                D
            </div>

            <div class="summary-value">

                <strong id="daysD">—</strong>
                <br>

                Total :
                <strong id="totalD">0</strong>

                <br>

                Moyenne :
                <strong id="averageD">—</strong>

            </div>

        </div>


    </div>


    <!-- --------------------------------------------------
         TABLEAU
    -------------------------------------------------- -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Date</th>
                    <th>Code</th>
                    <th>Écart</th>
                    <th></th>

                </tr>

            </thead>


            <tbody>

                <tr>

                    <td
                        colspan="4"
                        class="empty"
                    >
                        Aucune donnée
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- --------------------------------------------------
         AJOUT
    -------------------------------------------------- -->

    <button
        class="add-button"
        type="button"
    >
        +
    </button>


    <!-- --------------------------------------------------
         RETOUR EN HAUT
    -------------------------------------------------- -->

    <button
        class="top-button"
        id="topButton"
        type="button"
        aria-label="Retour en haut"
        title="Retour en haut"
    >
        ↑
    </button>


    <!-- --------------------------------------------------
         EXCEL
    -------------------------------------------------- -->

    <button
        class="export-button"
        id="exportButton"
        type="button"
    >
        Export Excel
    </button>


    <button
        class="import-button"
        id="importButton"
        type="button"
    >
        Importer Excel
    </button>


    <input
        type="file"
        id="importFile"
        accept=".xlsx,.xls"
        style="display: none;"
    >


</div>


<!-- --------------------------------------------------
     MODALE
-------------------------------------------------- -->

<div id="modal">


    <div class="modal-content">


        <h2>
            Ajouter une entrée
        </h2>


        <!-- DATE -->

        <label for="dateInput">
            Date
        </label>


        <input
            type="date"
            id="dateInput"
            autocomplete="off"
        >


        <!-- CODE -->

        <label>
            Code
        </label>


        <div class="code-buttons">


            <button
                class="code-button"
                data-code="S"
                type="button"
            >
                S
            </button>


            <button
                class="code-button"
                data-code="D"
                type="button"
            >
                D
            </button>


        </div>


        <!-- ACTIONS -->

        <div class="modal-actions">


            <button
                id="cancelButton"
                type="button"
            >
                Annuler
            </button>


            <button
                id="addButton"
                type="button"
            >
                Ajouter
            </button>


        </div>


    </div>


</div>


<!-- --------------------------------------------------
     BIBLIOTHÈQUE EXCEL
-------------------------------------------------- -->

<script
    src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"
></script>


<!-- --------------------------------------------------
     APPLICATION
-------------------------------------------------- -->

<script src="app.js"></script>


<!-- --------------------------------------------------
     RETOUR EN HAUT
-------------------------------------------------- -->

<script>

    document
        .getElementById("topButton")
        .addEventListener("click", function () {

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        });

</script>


</body>

</html>
