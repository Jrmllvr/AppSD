<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="S / D">

    <title>S / D</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f7;
            color: #1c1c1e  ;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .summary {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .summary-card {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .summary-code {
            font-size: 24px;
            font-weight: bold;
        }

        .summary-value {
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #eeeeef;
            padding: 12px 8px;
            font-size: 14px;
        }

       td {
    padding: 14px 6px;
    text-align: center;
    border-top: 1px solid #eeeeee;
    font-size: 16px;
}

td:first-child {
    text-align: left;
    padding-left: 14px;
}

.delete-button {
    border: none;
    background: transparent;
    color: #999;
    font-size: 22px;
    width: 35px;
    height: 35px;
    cursor: pointer;
}

.delete-button:active {
    color: #ff3b30;
}
        }

        .add-button {
    display: block;
    width: 56px;
    height: 56px;
    margin: 25px auto 0;
    border: none;
    border-radius: 50%;
    background: #007aff;
    color: white;
    font-size: 32px;
    line-height: 56px;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}

.add-button:active {
    transform: scale(0.95);
}
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>S / D</h1>

    <div class="summary">

    <div class="summary-card">
        <div class="summary-code">S</div>
        <div class="summary-value">
            Moyenne : <strong id="averageS">—</strong><br>
            Total : <strong id="totalS">0</strong>
        </div>
    </div>

    <div class="summary-card">
        <div class="summary-code">D</div>
        <div class="summary-value">
            Moyenne : <strong id="averageD">—</strong><br>
            Total : <strong id="totalD">0</strong>
        </div>
    </div>

</div>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Date</th>
<th>Code</th>
<th>Écart</th>
<th></th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td colspan="3" class="empty">
                        Aucune donnée
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

    <button class="add-button">+</button>
    <button class="export-button" id="exportButton">
    Export Excel
</button>
    <div id="modal" style="
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    align-items: center;
    justify-content: center;
">

    <div style="
        background: white;
        width: calc(100% - 40px);
        max-width: 400px;
        border-radius: 16px;
        padding: 25px;
    ">

        <h2>Ajouter une entrée</h2>

        <label>Date</label>

        <input
            type="date"
            id="dateInput"
            style="
                width: 100%;
                padding: 12px;
                margin: 8px 0 20px;
                font-size: 16px;
            "
        >

        <label>Code</label>

        <div style="
            display: flex;
            gap: 10px;
            margin-top: 8px;
        ">

            <button class="code-button" data-code="S"
                style="
                    flex: 1;
                    padding: 12px;
                    font-size: 18px;
                ">
                S
            </button>

            <button class="code-button" data-code="D"
                style="
                    flex: 1;
                    padding: 12px;
                    font-size: 18px;
                ">
                D
            </button>

        </div>

        <div style="
            display: flex;
            gap: 10px;
            margin-top: 25px;
        ">

            <button id="cancelButton"
                style="
                    flex: 1;
                    padding: 12px;
                ">
                Annuler
            </button>

            <button id="addButton"
                style="
                    flex: 1;
                    padding: 12px;
                ">
                Ajouter
            </button>

        </div>

    </div>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>

</body>
</html>
